name: Deploy dashboard

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Refresh data and build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the database secret is set
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error title=Missing secret::Repository secret DATABASE_URL is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "DATABASE_URL secret is present."

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt

      - name: Refresh pipeline (views, data quality, export, Excel report)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python automation/refresh_pipeline.py

      - name: Upload weekly Excel report
        uses: actions/upload-artifact@v4
        with:
          name: weekly-report
          path: |
            reports/weekly_metrics_report.xlsx
            reports/weekly_email_draft.md
            reports/run_log.jsonl

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboards/web/package-lock.json
      - name: Build site
        working-directory: dashboards/web
        env:
          VITE_BASE: /wm-client-analytics/
          VITE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboards/web/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
