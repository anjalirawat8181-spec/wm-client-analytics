<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <title>WM Analytics</title>
    <meta name="description" content="Client analytics for a wealth manager: AUM, net new money, attrition, advisors and data quality. All data is synthetic." />
    <meta name="theme-color" content="#f6f5f2" />
    <meta property="og:title" content="WM Analytics" />
    <meta property="og:description" content="AUM, net new money, attrition, advisors and data quality on synthetic wealth-management data." />
    <meta property="og:type" content="website" />
    <style>
      html { background: #f6f5f2; }
      html[data-theme="dark"] { background: #121214; }
    </style>
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem("wm-theme"); } catch (e) { t = null; }
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
