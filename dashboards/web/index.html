<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <title>Wealth Client Analytics</title>
    <meta name="description" content="Private-banking style client analytics dashboard: AUM, net new money, attrition, advisor performance and data quality. All data is synthetic." />
    <meta name="theme-color" content="#0B1020" />
    <meta property="og:title" content="Wealth Client Analytics" />
    <meta property="og:description" content="AUM, net new money, attrition, advisors and data quality on synthetic wealth-management data." />
    <meta property="og:type" content="website" />
    <script>
      // Apply the saved theme before first paint to avoid a flash. Storage can throw (private mode), so guard it.
      (function () {
        var t = null;
        try { t = localStorage.getItem("wm-theme"); } catch (e) { t = null; }
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
